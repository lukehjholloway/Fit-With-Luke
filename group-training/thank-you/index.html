<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>You're In! — Fit With Luke</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&family=Barlow+Condensed:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --black:#0a0a0a; --card:#161616; --border:#222;
    --orange:#f97316; --orange-dim:#ea6a0a; --gold:#f5c842;
    --white:#ffffff; --text:#f0ede8; --text2:#a09890; --muted:#5a5550;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    background:var(--black);color:var(--text);font-family:'Barlow',sans-serif;
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    padding:2rem 1.5rem;text-align:center;
  }
  .wrap{max-width:560px;position:relative;}
  .wrap::before{
    content:"";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    width:700px;height:700px;background:radial-gradient(circle,rgba(249,115,22,.12) 0%,rgba(245,200,66,.06) 40%,transparent 70%);
    z-index:0;pointer-events:none;
  }
  .content{position:relative;z-index:1;}
  .check{
    width:64px;height:64px;border-radius:50%;background:var(--orange);
    display:flex;align-items:center;justify-content:center;margin:0 auto 1.6rem;
    font-size:2rem;color:#fff;
  }
  .eyebrow{font-family:'Barlow Condensed',sans-serif;font-size:.8rem;font-weight:700;letter-spacing:.28em;text-transform:uppercase;color:var(--gold);margin-bottom:.8rem;}
  h1{font-family:'Bebas Neue',sans-serif;font-size:clamp(2.2rem,6vw,3.2rem);line-height:1.05;margin-bottom:1rem;}
  h1 span{color:var(--orange);}
  p{font-size:1.05rem;color:var(--text2);line-height:1.6;margin-bottom:1.8rem;}
  p strong{color:var(--white);}
  .cta-btn{
    display:inline-block;background:var(--orange);color:#fff;font-family:'Barlow Condensed',sans-serif;
    font-size:1.05rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;text-decoration:none;
    padding:1rem 2.2rem;border-radius:6px;box-shadow:0 6px 24px rgba(249,115,22,.35);
    transition:background .18s, transform .15s;
  }
  .cta-btn:hover{background:var(--orange-dim);transform:translateY(-2px);}
  .fine{font-size:.85rem;color:var(--muted);margin-top:1.4rem;line-height:1.5;}
  .fine a{color:var(--text2);text-decoration:none;}
  .fine a:hover{color:var(--orange);}
</style>
</head>
<body>
<div class="wrap">
  <div class="content">
    <div class="check">✓</div>
    <div class="eyebrow">Payment Received</div>
    <h1>You're In, <span>Cohort 2.</span></h1>
    <p>Welcome to <strong>Prepare To Perform</strong>. One last step — tell us a bit about you so Luke can set up your Everfit program before <strong>December 1</strong>.</p>
    <a class="cta-btn" href="https://forms.gle/8MpD2cC45uyPn5Di8" target="_blank" rel="noopener">Complete Your Welcome Form</a>
    <p class="fine">Questions in the meantime? Message Luke on WhatsApp at <a href="https://wa.me/16198294812">+1 (619) 829-4812</a>.</p>
  </div>
</div>
</body>
</html>
